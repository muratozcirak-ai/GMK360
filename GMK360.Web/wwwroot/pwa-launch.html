<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>GMK360 Yükleniyor...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, #0f172a 60%, #090e1a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 22px;
            padding: 34px 26px;
            text-align: center;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
        }
        .logo-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(249, 115, 22, 0.28);
            overflow: hidden;
        }
        .logo-wrap img { width: 58px; height: 58px; object-fit: contain; }
        .brand { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .brand span { color: #f97316; }
        .status { font-size: 0.94rem; color: #cbd5e1; min-height: 24px; margin-bottom: 18px; }
        .bar-track {
            width: 100%;
            height: 6px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .bar-fill {
            width: 42%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #f97316, #fbbf24, #38bdf8);
            animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(260%); }
        }
        .hint { font-size: 0.76rem; color: #94a3b8; }
        .retry {
            display: none;
            margin-top: 16px;
            background: #f97316;
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 9px 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/icons/icon-192.png" alt="GMK360" />
        </div>
        <div class="brand">GMK<span>360</span></div>
        <div class="status" id="launchStatus">Sistem yükleniyor, lütfen bekleyin...</div>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <div class="hint" id="launchHint">Çalışma alanınız hazırlanıyor</div>
        <button type="button" class="retry" id="retryBtn" onclick="window.location.replace('/Account/Start')">Tekrar Dene</button>
    </div>

    <script>
        (function () {
            var statusEl = document.getElementById('launchStatus');
            var hintEl = document.getElementById('launchHint');
            var retryBtn = document.getElementById('retryBtn');

            setTimeout(function () {
                if (statusEl) statusEl.innerText = 'Sunucu bağlantısı kuruluyor, az kaldı...';
                if (hintEl) hintEl.innerText = 'İlk açılışta sunucu hazırlanması birkaç saniye sürebilir.';
            }, 3000);

            setTimeout(function () {
                if (statusEl) statusEl.innerText = 'Oturum ve veriler hazırlanıyor...';
                if (retryBtn) retryBtn.style.display = 'inline-block';
            }, 10000);

            if (!navigator.onLine) {
                if (statusEl) statusEl.innerText = 'İnternet bağlantısı bulunamadı.';
                if (hintEl) hintEl.innerText = 'Bağlantınızı kontrol edip tekrar deneyin.';
                if (retryBtn) retryBtn.style.display = 'inline-block';
                return;
            }

            window.location.replace('/Account/Start');
        })();
    </script>
</body>
</html>
