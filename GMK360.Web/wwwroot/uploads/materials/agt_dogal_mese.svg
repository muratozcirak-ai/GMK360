<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
        <defs>
            <linearGradient id="oak" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d4a373" />
                <stop offset="50%" stop-color="#c5925e" />
                <stop offset="100%" stop-color="#b07d4b" />
            </linearGradient>
            <pattern id="grain" width="100" height="20" patternUnits="userSpaceOnUse">
                <line x1="0" y1="5" x2="100" y2="5" stroke="#996535" stroke-width="0.75" opacity="0.3"/>
                <line x1="0" y1="12" x2="100" y2="12" stroke="#e0b589" stroke-width="0.5" opacity="0.4"/>
            </pattern>
        </defs>
        <rect width="400" height="260" fill="url(#oak)"/>
        <rect width="400" height="260" fill="url(#grain)"/>
        <!-- Planks lines -->
        <line x1="0" y1="65" x2="400" y2="65" stroke="#5c3d1e" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="130" x2="400" y2="130" stroke="#5c3d1e" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="195" x2="400" y2="195" stroke="#5c3d1e" stroke-width="1.5" opacity="0.6"/>
        <rect x="20" y="190" width="360" height="50" rx="10" fill="#000000" fill-opacity="0.6"/>
        <text x="200" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AGT Effect 10mm Derzli</text>
        <text x="200" y="232" font-family="Arial, sans-serif" font-size="12" fill="#e9edc9" text-anchor="middle">Doğal Meşe (Standart - 0 ₺ Fark)</text>
    </svg>