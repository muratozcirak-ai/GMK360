<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .header img { width: 32px; height: 32px; }
        .header h3 { margin: 0; color: #333; font-size: 18px; }
        button { 
            padding: 12px; 
            background: #4f46e5; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 8px; 
            width: 100%; 
            font-size:15px; 
            font-weight:bold;
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:hover { background: #4338ca; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #mesaj { margin-top: 15px; font-size: 13px; color: #4b5563; min-height: 20px; font-weight: 500;}
        .success { color: #10b981 !important; }
        .error { color: #ef4444 !important; }
    </style>
</head>
<body>
    <div class="header">
        <h3>Emlak Avcısı</h3>
    </div>
    <button id="btnCek">Bu İlanı Sisteme Çek</button>
    <div id="mesaj"></div>
    <script src="popup.js"></script>
</body>
</html>
